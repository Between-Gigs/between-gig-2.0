<script>
  try { var t = localStorage.getItem("bg-theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  /* Route changes only (step and theme transitions set data-vt and bring their own motion). */
  :root:not([data-vt])::view-transition-old(root) { animation: 160ms cubic-bezier(.4, 0, 1, 1) both bg-out; }
  :root:not([data-vt])::view-transition-new(root) { animation: 360ms cubic-bezier(.2, .8, .2, 1) 60ms both bg-in; }
  @keyframes bg-out { to { opacity: 0; } }
  @keyframes bg-in { from { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { ::view-transition-old(root), ::view-transition-new(root) { animation: none; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
<script>
  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(BetweenGigs.Templates.GigsApp, { imageBase: "img/", useHash: true }));
</script>
</body>
