name: Homepage preview QA
on:
  pull_request:
    paths:
      - 'app/preview/drafts/home-peter/**'
      - 'scripts/qa/home-peter.mjs'
      - '.github/workflows/home-peter-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: CHROMIUM_PATH=$(command -v google-chrome) node scripts/qa/home-peter.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-peter-preview
          path: deliverables/home-peter/
