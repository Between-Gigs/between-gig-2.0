name: Homepage preview QA
on:
  pull_request:
    paths:
      - 'app/preview/drafts/home-peter/**'
      - 'scripts/qa/home-peter.mjs'
      - '.github/workflows/home-peter-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: CHROMIUM_PATH=$(command -v google-chrome) node scripts/qa/home-peter.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: home-peter-preview
          path: deliverables/home-peter/
