name: Signup checks
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: signup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  signup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm lint:values && pnpm test
      - run: node scripts/qa/auth-data.mjs
      - run: pnpm build
      - run: node scripts/check-pages.mjs
      - name: Use the runner's installed Chrome for browser checks
        run: |
          bg_chrome_path=$(command -v google-chrome)
          test -x "$bg_chrome_path"
          "$bg_chrome_path" --version
          echo "CHROMIUM_PATH=$bg_chrome_path" >> "$GITHUB_ENV"
      - name: Test signup and existing product flow (sample mode, no real accounts)
        run: |
          node scripts/qa/auth-flow.mjs
          pnpm qa:flow
          node scripts/qa/funnel-cohort.mjs
      - name: Build Pages configuration with Clerk
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /between-gig-2.0
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Z2xhZC1tb25rZXktNjkwOC5jbGVyay5hY2NvdW50cy5kZXYk
      - name: Check password handoff and offline recovery (Clerk requests blocked)
        run: |
          node scripts/qa/clerk-entry.mjs
      - name: Verify signup callbacks, returning login and roles (isolated mock SDK)
        run: |
          node scripts/qa/clerk-contract.mjs
      - name: Server build (no internal routes) and its checks
        run: pnpm build:server && pnpm check:server
