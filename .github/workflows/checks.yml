name: Signup checks
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: signup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  signup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm lint:values && pnpm test
      - run: node scripts/qa/auth-data.mjs
      - run: pnpm build
      - run: node scripts/check-pages.mjs
      - name: Use the runner's installed Chrome for browser checks
        run: |
          bg_chrome_path=$(command -v google-chrome)
          test -x "$bg_chrome_path"
          "$bg_chrome_path" --version
          echo "CHROMIUM_PATH=$bg_chrome_path" >> "$GITHUB_ENV"
      - name: Capture auth approval previews
        run: node scripts/qa/auth-preview.mjs
      - name: Save auth approval captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: auth-eyebrow-approval-evidence
          path: deliverables/auth-preview
          if-no-files-found: warn
      - name: Test signup and existing product flow (sample mode, no real accounts)
        run: |
          node scripts/qa/auth-flow.mjs
          node scripts/qa/profile-entry.mjs
          node scripts/qa/hub-staff.mjs
          node scripts/qa/owner-sidebar.mjs
          node scripts/qa/admin-shell.mjs
          node scripts/qa/admin-navigation.mjs
          node scripts/qa/navigation-modes.mjs
          node scripts/qa/social-preview.mjs
          node scripts/qa/signed-out-navigation.mjs
          node scripts/qa/home-hero.mjs
          node scripts/qa/storyboard-profile.mjs
          node scripts/qa/professionals-copy.mjs
          node scripts/qa/sample-order.mjs
          node scripts/qa/patti-editor-presentation.mjs
          node scripts/qa/profile-guidance.mjs
          node scripts/qa/gigster-priority.mjs
          pnpm qa:flow
          node scripts/qa/funnel-cohort.mjs
      - name: Save Gigster profile adjustment captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gigster-priority-evidence
          path: deliverables/gigster-priority
          if-no-files-found: warn
      - name: Save navigation modes and settings captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: navigation-modes-evidence
          path: deliverables/navigation-modes
          if-no-files-found: warn
      - name: Save admin navigation captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: admin-navigation-evidence
          path: deliverables/admin-navigation
          if-no-files-found: warn
      - name: Save Storyboard design system captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storyboard-design-system-evidence
          path: deliverables/storyboard-profile
          if-no-files-found: warn
      - name: Save Professionals implementation captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: professionals-adjusted-evidence
          path: deliverables/professionals-adjusted
          if-no-files-found: warn
      - name: Build Pages configuration with Clerk
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /between-gig-2.0
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Z2xhZC1tb25rZXktNjkwOC5jbGVyay5hY2NvdW50cy5kZXYk
      - name: Check password handoff and offline recovery (Clerk requests blocked)
        run: |
          node scripts/qa/clerk-entry.mjs
      - name: Verify signup callbacks, returning login and roles (isolated mock SDK)
        run: |
          node scripts/qa/clerk-contract.mjs
      - name: Server build (no internal routes) and its checks
        run: pnpm build:server && pnpm build:preview && pnpm check:server && QA_SCREENSHOT_DIR=deliverables/server-hub node scripts/qa/server-hub.mjs
      - name: Save verified Hub access captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-hub-access-evidence
          path: deliverables/server-hub
          if-no-files-found: warn
      # The deployed builds are live (api): there, no page may ship the sample data. Caught here, not at deploy.
      - name: Live server build, code-split check
        env:
          NEXT_PUBLIC_DATA_SOURCE: api
        run: pnpm build:server && node scripts/check-split.mjs
