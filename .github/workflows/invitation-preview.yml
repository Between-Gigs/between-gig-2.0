name: Invitation preview QA
on:
  pull_request:
    paths:
      - 'emails/**'
      - 'components/emails/**'
      - 'components/journey/**'
      - 'app/preview/gigster-journey/**'
      - 'scripts/qa/invitation.mjs'
      - 'scripts/qa/stage-two-journey.mjs'
      - 'scripts/qa/owner-email-hub.mjs'
      - 'scripts/qa/email-send-controls.mjs'
      - 'scripts/qa/manual-email-resends.mjs'
      - 'scripts/qa/email-preview-views.mjs'
      - 'lib/email-preview-view*'
      - 'lib/email-manual*'
      - 'lib/server/manual-emails*'
      - 'app/api/emails/**'
      - 'lib/email-test-retry*'
      - 'lib/server/*idempotency*'
      - 'tests/contracts/company-os/**'
      - '.github/workflows/invitation-preview.yml'
permissions:
  contents: read
jobs:
  invitation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run lib/email-test-retry.test.ts lib/server/email-hub.test.ts lib/email-manual.test.ts lib/server/manual-emails.test.ts lib/email-preview-view.test.ts
      - run: pnpm build
      - run: CHROMIUM_PATH=$(command -v google-chrome) node scripts/qa/email-preview-views.mjs
      - run: CHROMIUM_PATH=$(command -v google-chrome) node scripts/qa/invitation.mjs
      - run: CHROMIUM_PATH=$(command -v google-chrome) node scripts/qa/stage-two-journey.mjs
      - run: CHROMIUM_PATH=$(command -v google-chrome) node scripts/qa/owner-email-hub.mjs
      - run: CHROMIUM_PATH=$(command -v google-chrome) node scripts/qa/email-send-controls.mjs
      - run: CHROMIUM_PATH=$(command -v google-chrome) node scripts/qa/manual-email-resends.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: invitation-preview
          path: |
            deliverables/invitation/
            deliverables/owner-email-hub/
            deliverables/manual-email-resends/
            deliverables/email-preview-views/
